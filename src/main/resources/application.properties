spring.data.mongodb.uri=mongodb://localhost:27017/cloudshare

server.servlet.context-path=/api/v1.0

spring.data.mongodb.auto-index-creation=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

clerk.issuer=${ADD_YOUR_ISSUER}
clerk.jwks-url=${ADD_YOUR_JWKS_URL}
clerk.webhook.secret=${ADD_YOUR_WEBHOOK_SECRET}

stripe.api.key=${ADD_YOUR_ISSUER}
stripe.webhook.secret= ${STRIPE_WEBHOOK_SECRET}
app.frontend.url=${APP_FRONTEND_UR}
#file upload config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=125MB