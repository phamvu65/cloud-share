spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

server.servlet.context-path=/api/v1.0

file.upload-dir=./upload

# Self-hosted Ollama instance used by the DOCX translate feature. The model must be
# instruction-tuned and support "format: json" structured output (e.g. qwen2.5:3b).
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/api/chat}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
# CPU thread count Ollama uses per inference call. Match this to the deployment's logical
# core count for best throughput.
ollama.num-thread=${OLLAMA_NUM_THREAD:8}
# Context window given to the model per call. Must be large enough to hold the prompt plus the
# full translated JSON output, or generation gets cut off mid-array (invalid JSON).
ollama.num-ctx=${OLLAMA_NUM_CTX:8192}

# Headless LibreOffice binary used for Word/PPTX/Excel/HTML <-> PDF conversion.
# Defaults to "soffice" resolved from PATH (true in the Docker image); on Windows dev
# machines point this at the full soffice.exe path, e.g. C:/Program Files/LibreOffice/program/soffice.exe
libreoffice.soffice-path=${LIBREOFFICE_PATH:soffice}
libreoffice.timeout-seconds=${LIBREOFFICE_TIMEOUT_SECONDS:120}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.jwtSecret=${JWT_SECRET_KEY}
app.jwtExpirationMs=3600000
app.jwtRefreshExpirationMs=604800000

#clerk.issuer=${ADD_YOUR_ISSUER}
#clerk.jwks-url=${ADD_YOUR_JWKS_URL}
#clerk.webhook.secret=${ADD_YOUR_WEBHOOK_SECRET}

stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

app.frontend.url=${APP_FRONTEND_URL}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=125MB

server.port=${PORT:8080}

# /api/v1.0/actuator/health for uptime checks, /api/v1.0/actuator/prometheus for Prometheus
# scraping (both prefixed by server.servlet.context-path above). Only these two are exposed -
# everything else actuator ships (env, beans, threaddump, ...) stays off by default.
management.endpoints.web.exposure.include=health,prometheus
# Tags every exported metric with application="cloudshareapi" - most community Grafana
# dashboards for Micrometer (e.g. JVM (Micrometer), id 4701) use this as their template
# variable to filter panels; without it the variable dropdown is empty and panels show
# "No data" even though Prometheus is scraping fine.
management.metrics.tags.application=cloudshareapi

google.client-id=${GOOGLE_CLIENT_ID}

