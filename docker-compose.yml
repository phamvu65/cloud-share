services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      # Bound to localhost only - Nginx is the sole public entrypoint, and this
      # sidecar has no auth of its own so it must never be reachable directly.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Pulls the model once into the persisted volume on first start; subsequent
    # restarts skip straight to "ollama serve" since the model is already cached.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:3b && wait"]

  app:
    build: .
    container_name: cloudshareapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Docker network, the sidecar is reachable by service name, not localhost.
      - OLLAMA_API_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=qwen2.5:3b
      # soffice ships inside this image and is already on PATH - no override needed.
      # SPRING_DATA_MONGODB_URI comes from .env - point it at MongoDB Atlas
      # (mongodb+srv://...) in production instead of overriding it here.
    ports:
      # Bound to localhost only - Nginx reverse-proxies 443 -> 127.0.0.1:8080.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./upload:/app/upload
    depends_on:
      - ollama

volumes:
  ollama-models:
