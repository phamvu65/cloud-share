services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      # Bound to localhost only - Nginx is the sole public entrypoint, and this
      # sidecar has no auth of its own so it must never be reachable directly.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Pulls the model once into the persisted volume on first start; subsequent
    # restarts skip straight to "ollama serve" since the model is already cached.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:3b && wait"]

  app:
#    build: .
    image: ghcr.io/phamvu65/cloud-share:latest
    container_name: cloudshareapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Docker network, the sidecar is reachable by service name, not localhost.
      - OLLAMA_API_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=qwen2.5:3b
      # soffice ships inside this image and is already on PATH - no override needed.
      # SPRING_DATA_MONGODB_URI comes from .env - point it at MongoDB Atlas
      # (mongodb+srv://...) in production instead of overriding it here.
    ports:
      # Bound to localhost only - Nginx reverse-proxies 443 -> 127.0.0.1:8080.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./upload:/app/upload
    depends_on:
      - ollama

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to localhost - only for you to poke at the Prometheus UI over an SSH
      # tunnel if needed. Grafana reaches it internally via the Docker network.
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    mem_limit: 128m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.vuxph.xyz
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      # Bound to localhost - Nginx will reverse-proxy grafana.vuxph.xyz -> 127.0.0.1:3000 (Phase 3).
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  ollama-models:
  prometheus-data:
  loki-data:
  grafana-data:
